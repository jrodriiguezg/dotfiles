# Fondo con blur sobre la pantalla actual
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Reloj digital (Hora)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244) # text
    font_size = 90
    font_family = JetBrainsMono Nerd Font Propo Bold
    position = 0, 100
    halign = center
    valign = center
}

# Fecha completa debajo de la hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = rgb(180, 190, 254) # lavender
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 30
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(203, 166, 247) # mauve
    inner_color = rgb(30, 30, 46)     # base
    font_color = rgb(205, 214, 244)  # text
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Contraseña...</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    fail_timeout = 2000
    fail_transition = 300
    hide_input = false
}
